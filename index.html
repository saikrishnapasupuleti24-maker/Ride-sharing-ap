<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Sharing App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚗 RideNow</h1>
        <p>Fast, Safe & Affordable Rides</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Book a Ride</h2>

            <label>Pickup Location</label>
            <input type="text" id="pickup" placeholder="Enter pickup location">

            <label>Destination</label>
            <input type="text" id="destination" placeholder="Enter destination">

            <label>Ride Type</label>
            <select id="rideType">
                <option value="10">Bike - ₹10/km</option>
                <option value="15">Auto - ₹15/km</option>
                <option value="20">Car - ₹20/km</option>
            </select>

            <label>Distance (km)</label>
            <input type="number" id="distance" placeholder="Enter distance">

            <button onclick="calculateFare()">Estimate Fare</button>

            <div id="fare"></div>

            <button onclick="bookRide()">Book Ride</button>

            <p id="message"></p>
        </div>

        <div class="card">
            <h2>Ride History</h2>
            <ul id="rideHistory">
                <li>No rides yet</li>
            </ul>
        </div>

        <div class="card">
            <h2>Rate Driver</h2>

            <select id="rating">
                <option value="5">⭐⭐⭐⭐⭐</option>
                <option value="4">⭐⭐⭐⭐</option>
                <option value="3">⭐⭐⭐</option>
                <option value="2">⭐⭐</option>
                <option value="1">⭐</option>
            </select>

            <button onclick="rateDriver()">Submit Rating</button>

            <p id="ratingMessage"></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
